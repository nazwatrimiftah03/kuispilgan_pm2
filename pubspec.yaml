
name: kuispilgan_pm2
description: "Aplikasi Kuis Pilihan Ganda Ilmu Komputer"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.3

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
